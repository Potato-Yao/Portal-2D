<script type="text/javascript">
    // 禁止#day_shown元素被选中
    const dayShown = document.getElementById('day_shown');
    if (dayShown) {
        dayShown.addEventListener('selectstart', function (e) {
            e.preventDefault();
            return false;
        });
        dayShown.addEventListener('mousedown', function (e) {
            e.preventDefault();
            return false;
        });
    }

    window.onload = async () => {
        window.$store = new Store();

        if (!Auth.isAuthenticated()) {
            Auth.toLogin();
        }

        let toLoad = Store.get("toLoad") ?? undefined;
        let stateValue = 0;
        
        if (toLoad) {
            toLoad = JSON.parse(toLoad);
            Store.remove("toLoad");
            // 确保state是数字类型
            stateValue = Number(toLoad.state) || 0;
            window.$gameState = toLoad.state;
        }

        // 从localStorage读取胜利次数，如果不存在则初始化为0
        window.$gameStateSum = parseInt(Store.get("gameStateSum")) || 0;
        
        // 如果有新的state值，才增加胜利次数
        if (stateValue > 0) {
            window.$gameStateSum += stateValue;
            // 将更新后的胜利次数保存到localStorage
            Store.set("gameStateSum", window.$gameStateSum.toString());
        }

        // 更新胜利次数显示
        const winCountElement = document.getElementById('win-count');
        if (winCountElement) {
            winCountElement.textContent = `胜利次数: ${window.$gameStateSum / 2}`;
        }
        window.$game = new Game();
        window.$game.init(toLoad?.url).then(() => {
            window.$game.start();
        });
    };
</script>
